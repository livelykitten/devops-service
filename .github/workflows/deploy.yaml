name: devops_services workflow

on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Github Repository에 push한 코드 불러오기
        uses: actions/checkout@v4 # Repository에 저장된 코드를 불러오는 라이브러리

      # GitHub Actions에서 빌드하기 위해 JDK 필요
      - name: JDK 17버전 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: application.yaml 파일 만들기
        env:
          APPLICATION_CONFIG: ${{ secrets.APPLICATION_PROPERTIES }}
        run: |
          mkdir -p src/main/resources
          printf '%s\n' "$APPLICATION_CONFIG" > src/main/resources/application.yaml

      # 실행 권한이 없는 경우를 대비
      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 테스트 및 빌드하기
        run: ./gradlew clean build

      - name: Set AWS Credentials to access AWS Resource
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      
      - name: Sign-in into ECR 
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image based on the Dockerfile
        run: docker build -t devops-server .

      - name: Add Tag to the Docker image
        run: docker tag devops-server ${{ steps.login-ecr.outputs.registry }}/lg15-devops-server-repo/devops-server:latest

      - name: Push Docker image to ECR 
        run: docker push ${{ steps.login-ecr.outputs.registry }}/lg15-devops-server-repo/devops-server:latest

      - name: Login into EC2 using ssh
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            docker stop devops-server || true
            docker rm devops-server || true
            docker pull ${{ steps.login-ecr.outputs.registry }}/lg15-devops-server-repo/devops-server:latest
            docker run -d --name devops-server -p 8080:8080 ${{ steps.login-ecr.outputs.registry }}/lg15-devops-server-repo/devops-server:latest